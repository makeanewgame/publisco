packages:
  - "apps/*"
  - "packages/*"

# Overrides live in the root package.json ("pnpm.overrides"), NOT here: the
# pinned pnpm@9 (packageManager) silently ignores an `overrides:` key in this
# file (pnpm 10+ only), which left every override unapplied after 8f446c1.
# A global pnpm 11 prints `The "pnpm" field in package.json is no longer read`
# before handing off to pnpm@9 — that warning is harmless while the pin is 9;
# move overrides here only together with bumping packageManager to pnpm 10+.
